[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-alio-mcp"
version = "0.1.1"
description = "MCP server for Korean public institution information from ALIO and ALIO Plus."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "open-ALIO-mcp contributors" }
]
keywords = ["mcp", "alio", "public-sector", "korea", "open-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp[cli]>=1.0.0",
  "requests>=2.31.0",
  "xmltodict>=0.13.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
open-alio-mcp = "open_alio_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/gitbosung/open-ALIO-mcp"
Issues = "https://github.com/gitbosung/open-ALIO-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_alio_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/scripts",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
